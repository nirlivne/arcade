<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1B1740">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Bloop Stack</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c" aria-label="Bloop Stack game"></canvas>
<button id="mute" type="button" aria-label="Toggle sound">🔊</button>

<div id="start" class="overlay">
  <div class="panel">
    <h1>Bloop Stack</h1>
    <p class="hint">Drop. Match. Merge.</p>
    <button id="play" type="button" class="big">Play</button>
    <p class="best" id="startbest">Best: 0</p>
    <p class="keys">Drag &amp; release, or ← → and Space</p>
    <button id="about-open" type="button" class="small" aria-haspopup="dialog">ℹ️ About</button>
  </div>
</div>

<div id="about" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="about-title">
  <div class="panel">
    <h2 id="about-title">Bloop Stack</h2>
    <p class="hint">Made by The Game Company</p>
    <p class="keys">Original art and sound, made in code. Free and ad-free.</p>
    <a id="about-home" class="link" href="../../">More games</a>
    <button id="about-close" type="button" class="big">Close</button>
  </div>
</div>

<div id="paused" class="overlay hidden"><div class="panel"><h2>PAUSED</h2><p class="keys">Tap or press Space to resume</p></div></div>

<div id="over" class="overlay hidden">
  <div class="panel">
    <h2>JAR FULL!</h2>
    <div id="badge" class="badge hidden">NEW BEST!</div>
    <div class="score"><span id="final">0</span></div>
    <p class="best" id="bestline">Best 0</p>
    <button id="again" type="button" class="big">Play again</button>
    <button id="share" type="button" class="small">Share</button>
    <p class="keys">R or Enter to restart</p>
    <div id="spare" aria-hidden="true"></div>
  </div>
</div>

<script src="physics.js"></script>
<script src="game.js"></script>
<script src="register-sw.js"></script>
</body>
</html>
